<?xml version="1.0" encoding="UTF-8"?>
<!-- Moon Child's GlowIcon art: a small hooded child sitting on a crescent
     moon in a starry night. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c3a"/><stop offset="1" stop-color="#3a2a86"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fffbe0"/><stop offset="0.6" stop-color="#ffe066"/><stop offset="1" stop-color="#d99a1c"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/><stop offset="1" stop-color="#c2275e"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#sky)" stroke="#0b0726" stroke-width="3"/>
  <g fill="#ffffff">
    <circle cx="22" cy="22" r="2"/><circle cx="104" cy="18" r="2.5"/><circle cx="96" cy="44" r="1.6"/>
    <circle cx="16" cy="70" r="1.6"/><circle cx="40" cy="14" r="1.4"/><circle cx="110" cy="96" r="1.8"/>
  </g>
  <path d="M100 30 l2 5 5 1 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 -1z" fill="#fff6a8"/>
  <!-- the crescent -->
  <path d="M74 20 A46 46 0 1 0 108 96 A38 38 0 1 1 74 20z" fill="url(#moon)" stroke="#a46a0c" stroke-width="2.5"/>
  <!-- the child, sitting on the moon's lower horn -->
  <g stroke="#3b0c22" stroke-width="2" stroke-linejoin="round">
    <path d="M58 92 q-2 -20 10 -26 q12 6 10 26z" fill="url(#cloak)"/>
    <circle cx="68" cy="58" r="10" fill="#ffd9b8"/>
    <path d="M57 58 q0 -16 11 -17 q11 1 11 17 q-4 -8 -11 -8 q-7 0 -11 8z" fill="url(#cloak)"/>
    <path d="M62 92 l-3 10 h7 l1 -10z M74 92 l1 10 h7 l-3 -10z" fill="#5a2a7a"/>
  </g>
  <circle cx="64" cy="59" r="1.8" fill="#222"/><circle cx="72" cy="59" r="1.8" fill="#222"/>
  <path d="M65 64 q3 2.5 6 0" fill="none" stroke="#7a2a2a" stroke-width="1.5"/>
</svg>
